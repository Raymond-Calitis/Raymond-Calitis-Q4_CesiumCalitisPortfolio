<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Q4 2nd Graded Exercise">
    <meta name="keywords" content="HTML Forms">
    <meta name="author" content="Raymond Ashly C. Calitis">
    <title>Movie Rating</title>

    <style>
        body 
        {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 30px auto;
            padding: 20px;
        }
        h1 
        {
            font-size: 32px;
            margin-bottom: 30px;
        }
        label 
        {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        input, select 
        {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid black;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        .star-rating-table 
        {
            border-collapse: separate;
            border-spacing: 8px;
            margin: 10px 0;
        }
        .star-rating-table td 
        {
            padding: 0;
            width: 40px;
            height: 40px;
            text-align: center;
            vertical-align: middle;
        }
        .star-cell 
        {
            cursor: pointer;
            font-size: 30px;
            color: lightgrey;
            display: block;
            width: 40px;
            height: 40px;
            line-height: 40px;
        }
        .star-cell.selected 
        {
            color: rgb(215, 187, 22);
        }
        
        button 
        {
            background-color: black;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            margin: 20px 0;
            cursor: pointer;
        }
        h2 
        {
            font-size: 24px;
            margin: 30px 0 20px 0;
        }
        .movie-item 
        {
            padding: 15px;
            margin: 10px 0;
            border: 1px solid black;
            border-radius: 5px;
            font-size: 16px;
            background-color: lightgrey;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .movie-stars 
        {
            color: rgb(215, 187, 22);
            font-size: 20px;
            letter-spacing: 2px;
            margin-left: 5px;
        }
        .delete-btn
        {
            background-color: lightred;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Add a Movie</h1>
    
    <label>Title:</label>
    <input type="text" id="title">
    
    <label>Year:</label>
    <input type="text" id="year">
    
    <label>Genre:</label>
    <select id="genre">
        <option value="Action">Action</option>
        <option value="Comedy">Comedy</option>
        <option value="Drama">Drama</option>
        <option value="Horror">Horror</option>
        <option value="Sci-Fi">Sci-Fi</option>
    </select>
    
    <label>Rating:</label>
    <table class="star-rating-table" id="starTable">
        <tr>
            <td><span class="star-cell" id="star1" data-value="1">★</span></td>
            <td><span class="star-cell" id="star2" data-value="2">★</span></td>
            <td><span class="star-cell" id="star3" data-value="3">★</span></td>
            <td><span class="star-cell" id="star4" data-value="4">★</span></td>
            <td><span class="star-cell" id="star5" data-value="5">★</span></td>
        </tr>
    </table>
    
    <button id="addBtn">Add Movie</button>
    
    <h2>Movie List</h2>
    <div id="movieList"></div>

    <script>
        let currentRating = 0;
        const star1 = document.getElementById('star1');
        const star2 = document.getElementById('star2');
        const star3 = document.getElementById('star3');
        const star4 = document.getElementById('star4');
        const star5 = document.getElementById('star5');
        
        function clearAllStars() {
            star1.classList.remove('selected');
            star2.classList.remove('selected');
            star3.classList.remove('selected');
            star4.classList.remove('selected');
            star5.classList.remove('selected');
        }
        
        star1.addEventListener('click', function() {
            clearAllStars();
            currentRating = 1;
            star1.classList.add('selected');
        });

        star2.addEventListener('click', function() {
            clearAllStars();
            currentRating = 2;
            star1.classList.add('selected');
            star2.classList.add('selected');
        });

        star3.addEventListener('click', function() {
            clearAllStars();
            currentRating = 3;
            star1.classList.add('selected');
            star2.classList.add('selected');
            star3.classList.add('selected');
        });

        star4.addEventListener('click', function() {
            clearAllStars();
            currentRating = 4;
            star1.classList.add('selected');
            star2.classList.add('selected');
            star3.classList.add('selected');
            star4.classList.add('selected');
        });

        star5.addEventListener('click', function() {
            clearAllStars();
            currentRating = 5;
            star1.classList.add('selected');
            star2.classList.add('selected');
            star3.classList.add('selected');
            star4.classList.add('selected');
            star5.classList.add('selected');
        });

        document.getElementById('addBtn').addEventListener('click', function() {
            const title = document.getElementById('title').value.trim();
            const year = document.getElementById('year').value.trim();
            const genre = document.getElementById('genre').value;
            
            if (!title || !year || currentRating === 0) {
                alert('Please fill all fields and select rating');
                return;
            }
            
            const movies = JSON.parse(localStorage.getItem('movies')) || [];
            
            const existingIndex = movies.findIndex(m => m.title.toLowerCase() === title.toLowerCase());
            
            if (existingIndex !== -1) {
                const existingRating = parseInt(movies[existingIndex].rating);
                const newRating = currentRating;
                const averagedRating = Math.round((existingRating + newRating) / 2);
                
                movies[existingIndex] = {
                    title: title,
                    year: year,
                    genre: genre,
                    rating: averagedRating.toString()
                };
            } else {
                movies.push({
                    title: title,
                    year: year,
                    genre: genre,
                    rating: currentRating.toString()
                });
            }
            
            localStorage.setItem('movies', JSON.stringify(movies));
            
            document.getElementById('title').value = '';
            document.getElementById('year').value = '';
            document.getElementById('genre').selectedIndex = 0;
            
            clearAllStars();
            currentRating = 0;
            
            displayMovies();
        });

        function deleteMovie(index) {
            if (confirm('Are you sure you want to delete?')) {
                let movies = JSON.parse(localStorage.getItem('movies')) || [];
                movies.splice(index, 1);
                localStorage.setItem('movies', JSON.stringify(movies));
                displayMovies();
            }
        }

        function displayMovies() {
            const movies = JSON.parse(localStorage.getItem('movies')) || [];
            const list = document.getElementById('movieList');
            list.innerHTML = '';
            
            for (let i = 0; i < movies.length; i++) {
                const m = movies[i];
                const rating = parseInt(m.rating);
                let starRating = '';
                for (let j = 0; j < rating; j++) {
                    starRating += '★';
                }
                
                const movieDiv = document.createElement('div');
                movieDiv.className = 'movie-item';
                movieDiv.innerHTML = 
                    '<div>' + m.title + ' (' + m.year + ') - ' + m.genre + ', Rating: <span class="movie-stars">' + starRating + '</span></div>' +
                    '<button class="delete-btn" onclick="deleteMovie(' + i + ')">Delete</button>';
                list.appendChild(movieDiv);
            }
        }

        displayMovies(); 
    </script>
</body>
</html>
